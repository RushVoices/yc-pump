 is","pinned at its creation price and only Q is read), times Q's curve `virtual_token_reserves`","over `virtual_quote_reserves` while Q's curve trades, or times Q's canonical pump-amm pool","base vault balance over its quote vault balance plus `Pool.virtual_quote_reserves` once it is","migrated (a complete Q not yet migrated fails `QuoteCurveAwaitingMigration`);","a migrated Q requires accounts six to eight: the pool (index 0 under pump's","`pool-authority` PDA for Q, quote seed WSOL for a SOL-quoted Q) and its base and quote","vaults (`QuotePoolAccountsRequired`, `QuotePoolNotFound`, `InvalidQuotePool`). The derived","value must be at least 1 and its graduation raise at most Q's mint supply","(`QuoteReservesOutOfRange`); the new curve stores `depth = Q.depth + 1` and, like a","quote-control coin, cannot be mayhem mode. The Token-2022","native mint is rejected, and a Token-2022 quote mint may only carry the xStock operable","extension set (metadata pointer/metadata, permanent delegate, initialized default account","state, scaled UI amount, pausable, confidential-transfer mint, and a transfer hook with no","program). The trailing `creator_fee_bps` argument (EOF-tolerant) sets the coin's own creator","fee rate for a quote mint admitted through quote-control or through a pump coin's curve,","and then requires `Global.creator_fee_configurable`, a non-cashback coin and a value in","`1..=Global.max_configurable_creator_fee_bps`; on a SOL or `Global`-whitelisted quote it is","ignored, and omitted or zero stores 0 so the pump-fees schedule rate applies.","`is_cashback_enabled` is deprecated and must be false. `is_holder_reward` (EOF-tolerant,","gated by `Global.is_holder_reward_enabled`) sets the creator to the `holder-rewards` PDA","of the mint, so creator fees accrue to its creator vault, are collected onto the PDA with","`collect_creator_fee*` and paid out through `distribute_fee_to_holders`."],discriminator:[214,144,76,236,95,139,49,180],accounts:[{name:"mint",writable
